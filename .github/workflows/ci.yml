name: Test marketplace flows

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yanxiaobei_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d yanxiaobei_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: mobile-web-demo
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yanxiaobei_test
      AUTH_TOKEN_SECRET: test-secret-that-is-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile-web-demo/package-lock.json
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run check
      - run: npm run test:http
