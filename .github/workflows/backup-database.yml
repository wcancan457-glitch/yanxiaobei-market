name: Backup Supabase database

on:
  workflow_dispatch:
  schedule:
    # Monday 02:20 Asia/Shanghai (Sunday 18:20 UTC)
    - cron: '20 18 * * 0'

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check required secrets
        run: |
          test -n "$DATABASE_URL" || { echo 'Missing DATABASE_URL'; exit 1; }
          test -n "$BACKUP_PASSPHRASE" || { echo 'Missing BACKUP_PASSPHRASE'; exit 1; }

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create encrypted logical backup
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          dump="yanxiaobei-${stamp}.dump"
          mkdir -p backups
          encrypted="backups/${dump}.enc"
          pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges --file="$dump"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in "$dump" -out "$encrypted" -pass env:BACKUP_PASSPHRASE
          rm -f "$dump"

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: supabase-database-backup
          path: backups/*.enc
          if-no-files-found: error
          retention-days: 30
