name: Deploy to Hong Kong server

on:
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # GitHub-hosted runners can occasionally remain queued for more than 15
    # minutes. Keep a bounded timeout without cancelling before a runner starts.
    timeout-minutes: 60
    steps:
      - name: Check out the latest release
        uses: actions/checkout@v4

      - name: Upload application files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: mobile-web-demo
          target: /tmp/yanxiaobei-release
          rm: true
          timeout: 60s
          command_timeout: 5m

      - name: Install and start the application
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          APP_DATABASE_URL: ${{ secrets.APP_DATABASE_URL }}
          AUTH_TOKEN_SECRET: ${{ secrets.AUTH_TOKEN_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          timeout: 60s
          command_timeout: 8m
          envs: MIGRATION_DATABASE_URL,APP_DATABASE_URL,AUTH_TOKEN_SECRET,SMTP_HOST,SMTP_PORT,SMTP_SECURE,SMTP_USER,SMTP_PASS,MAIL_FROM
          script: |
            set -eu

            APP_DIR=/opt/yanxiaobei-market
            RELEASE_DIR=/tmp/yanxiaobei-release/mobile-web-demo

            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y nginx rsync snapd
            command -v npm > /dev/null

            DOMAIN=yanxiaobei.wangpangxie.top

            if [ -z "${MIGRATION_DATABASE_URL:-}" ]; then
              echo "Missing GitHub Actions secret: MIGRATION_DATABASE_URL" >&2
              exit 1
            fi
            if [ -z "${APP_DATABASE_URL:-}" ]; then
              echo "Missing GitHub Actions secret: APP_DATABASE_URL" >&2
              exit 1
            fi
            if [ -z "${AUTH_TOKEN_SECRET:-}" ]; then
              echo "Missing GitHub Actions secret: AUTH_TOKEN_SECRET" >&2
              exit 1
            fi

            mkdir -p "$APP_DIR/data"
            cd "$RELEASE_DIR"
            npm ci --omit=dev
            npm run check
            npm run mail:verify
            export DATABASE_URL="$MIGRATION_DATABASE_URL"
            npm run db:migrate
            npm run db:configure-role
            if [ ! -f "$APP_DIR/data/.postgres-migrated" ]; then
              DATA_DIR="$APP_DIR/data" npm run db:import-json
              touch "$APP_DIR/data/.postgres-migrated"
            fi

            DATABASE_URL="$APP_DATABASE_URL" \
              TEST_ADMIN_DATABASE_URL="$MIGRATION_DATABASE_URL" \
              AUTH_TOKEN_SECRET="$AUTH_TOKEN_SECRET" \
              TEST_PORT=5199 \
              npm run test:http

            rsync -a --delete --exclude 'data/' "$RELEASE_DIR/" "$APP_DIR/"
            chown -R root:root "$APP_DIR"
            chown -R www-data:www-data "$APP_DIR/data"
            chmod 750 "$APP_DIR/data"

            umask 077
            {
              printf 'DATABASE_URL=%s\n' "$APP_DATABASE_URL"
              printf 'AUTH_TOKEN_SECRET=%s\n' "$AUTH_TOKEN_SECRET"
              printf 'APP_BASE_URL=%s\n' "https://${DOMAIN}"
              printf 'SMTP_HOST=%s\n' "${SMTP_HOST:-}"
              printf 'SMTP_PORT=%s\n' "${SMTP_PORT:-587}"
              printf 'SMTP_SECURE=%s\n' "${SMTP_SECURE:-false}"
              printf 'SMTP_USER=%s\n' "${SMTP_USER:-}"
              printf 'SMTP_PASS=%s\n' "${SMTP_PASS:-}"
              printf 'MAIL_FROM=%s\n' "${MAIL_FROM:-}"
            } > /etc/yanxiaobei-market.env
            chown root:root /etc/yanxiaobei-market.env
            chmod 600 /etc/yanxiaobei-market.env

            cat > /etc/systemd/system/yanxiaobei-market.service <<'SERVICE'
            [Unit]
            Description=Yanxiaobei Campus Marketplace
            After=network.target

            [Service]
            Type=simple
            User=www-data
            Group=www-data
            WorkingDirectory=/opt/yanxiaobei-market
            Environment=NODE_ENV=production
            Environment=PORT=5177
            Environment=DATA_DIR=/opt/yanxiaobei-market/data
            EnvironmentFile=/etc/yanxiaobei-market.env
            ExecStart=/usr/bin/node /opt/yanxiaobei-market/server.js
            Restart=always
            RestartSec=3
            NoNewPrivileges=true
            PrivateTmp=true
            ProtectSystem=full
            ReadWritePaths=/opt/yanxiaobei-market/data

            [Install]
            WantedBy=multi-user.target
            SERVICE

            cat > /etc/nginx/sites-available/yanxiaobei-market <<'NGINX'
            server {
                listen 80 default_server;
                listen [::]:80 default_server;
                server_name yanxiaobei.wangpangxie.top _;

                client_max_body_size 5m;
                error_page 413 = @payload_too_large;

                location @payload_too_large {
                    default_type application/json;
                    return 413 '{"ok":false,"error":"上传内容过大，请压缩图片后重试","code":"request_too_large"}';
                }

                location = /api/events {
                    proxy_pass http://127.0.0.1:5177;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $remote_addr;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_set_header Connection '';
                    proxy_buffering off;
                    proxy_cache off;
                    proxy_read_timeout 1h;
                    send_timeout 1h;
                }

                location / {
                    proxy_pass http://127.0.0.1:5177;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $remote_addr;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
            }
            NGINX

            rm -f /etc/nginx/sites-enabled/default
            ln -sfn /etc/nginx/sites-available/yanxiaobei-market /etc/nginx/sites-enabled/yanxiaobei-market

            systemctl daemon-reload
            systemctl enable --now yanxiaobei-market
            systemctl restart yanxiaobei-market
            nginx -t
            systemctl enable --now nginx
            systemctl reload nginx

            curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 2 \
              http://127.0.0.1:5177/ > /dev/null
            curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 2 \
              http://127.0.0.1:5177/api/health > /dev/null
            curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 2 \
              http://127.0.0.1:5177/api/bootstrap > /dev/null

            # Use the current Certbot release and let its systemd timer renew the
            # certificate automatically. Port 80 remains available for ACME checks.
            systemctl enable --now snapd.socket
            snap wait system seed.loaded
            snap install core || snap refresh core
            snap install --classic certbot || snap refresh certbot
            ln -sfn /snap/bin/certbot /usr/local/bin/certbot

            certbot --nginx \
              --non-interactive \
              --agree-tos \
              --no-eff-email \
              --register-unsafely-without-email \
              --redirect \
              --keep-until-expiring \
              --domain "$DOMAIN"

            nginx -t
            systemctl reload nginx
            curl --fail --silent --show-error --max-time 20 \
              --resolve "$DOMAIN:443:127.0.0.1" \
              "https://${DOMAIN}/" > /dev/null
            curl --fail --silent --show-error --max-time 20 \
              --resolve "$DOMAIN:443:127.0.0.1" \
              "https://${DOMAIN}/api/health" > /dev/null
            curl --fail --silent --show-error --max-time 20 \
              --resolve "$DOMAIN:443:127.0.0.1" \
              "https://${DOMAIN}/api/bootstrap" > /dev/null

            PUBLIC_IP="$(curl --fail --silent --max-time 10 https://api.ipify.org || true)"
            echo "Public URL: https://${DOMAIN}/"
            echo "Server public IPv4: ${PUBLIC_IP:-unavailable}"
            systemctl --no-pager --full status yanxiaobei-market | head -n 15

      - name: Verify the public site
        run: |
          curl --fail --silent --show-error --max-time 20 "https://yanxiaobei.wangpangxie.top/" > /dev/null
          curl --fail --silent --show-error --max-time 20 "https://yanxiaobei.wangpangxie.top/api/health" > /dev/null
          curl --fail --silent --show-error --max-time 20 "https://yanxiaobei.wangpangxie.top/api/bootstrap" > /dev/null
